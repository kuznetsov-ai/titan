name: ess
base_url: https://ess.i-develop.tech
environment: prod

auth:
  type: login_password
  login_url: /accounts/login/
  username_selector: "input[name='username']"
  password_selector: "input[name='password']"
  submit_selector: "button.login-submit"

roles:
  - name: manager
    username: ${TITAN_USERNAME:demo@idev.team}
    password: ${TITAN_PASSWORD:demo123!}

browser:
  type: chromium
  headless: true
  viewport:
    width: 1440
    height: 900
  timeout: 30000

ai:
  provider: claude_cli
  model: sonnet
  depth: deep

external_scenarios:
  ess: /Users/kuznetsov/Projects/iDev/Employee Share Scheme/testMe

crawl:
  max_pages: 20
  screenshot_delay: 1500
  ignore_patterns:
    - "/logout"
    - "/api/*"
